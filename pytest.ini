[pytest]
# Stage126+ Q1/Q2 Lean Research Governance (see
# project/docs/ai/STAGE126_Q1Q2_LEAN_GOVERNANCE.md): the default live suite
# excludes exactly two historical successor-state marker classes, by marker
# expression only (never --ignore, --deselect, node-ID suppression, -k, skip
# or xfail). No whole test file is excluded and every current scientific,
# current-state-validator, Handoff, final-test-lock or leakage test remains
# in the live gate.
#
# * `live_successor_state` — Stage125 Part 5 is historical and immutable, and
#   is NOT a live Stage126 successor-state gate. The tests inside its frozen
#   test file marked with this label assert the Handoff successor state as it
#   stood at the Part 2 reference commit: historical regression tests, not
#   statements about current Stage126 state. Verified separately against the
#   frozen reference commit by:
#       python project/run_stage125_part5_historical_successor_tests.py
#
# * `stage126_terminal_successor_state` — five pre-terminal successor
#   assertions inside the closed Part 1 / Part 2 robustness test files
#   (`test_expected_mismatch_matches_the_real_frozen_validator` in each, plus
#   `test_direct_handoff_validation_helper_is_exact`,
#   `test_deterministic_repeated_build_output` and `test_check_mode_is_clean`
#   in Part 2). They pin the workflow/Handoff successor state as it stood at
#   each Part's own closure date, before the terminal M1 robustness state
#   (Parts 3-5 completed) existed. They remain valid historical/provenance
#   tests but are not current-state Stage126 gates. Under Lean Governance, Git
#   history and the frozen scientific outputs already reachable at those
#   Parts' closing commits are sufficient historical provenance — no
#   executable historical-worktree runner is required or maintained as a
#   scientific acceptance gate.
markers =
    live_successor_state: historical Stage125 Part5 successor assertions; excluded from the current Stage126 live test gate
    stage126_terminal_successor_state: historical Part1/Part2 pre-terminal successor assertions; excluded from the current Stage126 live test gate

addopts = -m "not live_successor_state and not stage126_terminal_successor_state"
